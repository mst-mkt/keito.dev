allowBuilds:
  esbuild: false
  workerd: false
  "@chouquette/gleam": false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  "@chouquette/gleam": "-" # use gleam from flake.nix, not the npm binary

peerDependencyRules:
  ignoreMissing:
    - "@chouquette/gleam"
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
