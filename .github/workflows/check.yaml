name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: false
          gleam-version: "1.19.2"
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp run check
      - run: vp run test
      - run: vp run --ignore-depends-on build
